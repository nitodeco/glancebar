name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build app archive
        run: ./Scripts/package-app.sh

      - name: Upload release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/GlanceBar.app.zip
          draft: false
          prerelease: false
