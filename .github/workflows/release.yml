name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Import signing certificate
        uses: apple-actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.APPLE_CODESIGN_CERTIFICATE_BASE64 }}
          p12-password: ${{ secrets.APPLE_CODESIGN_CERTIFICATE_PASSWORD }}

      - name: Build app archive
        env:
          GLANCEBAR_SIGNING_IDENTITY: ${{ vars.GLANCEBAR_SIGNING_IDENTITY || 'Developer ID Application' }}
        run: ./Scripts/package-app.sh

      - name: Upload release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/GlanceBar.app.zip
          draft: false
          prerelease: false
