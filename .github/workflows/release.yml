name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    env:
      APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
      APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Import signing certificate
        uses: apple-actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.APPLE_CODESIGN_CERTIFICATE_BASE64 }}
          p12-password: ${{ secrets.APPLE_CODESIGN_CERTIFICATE_PASSWORD }}

      - name: Build release disk image
        env:
          GLANCEBAR_SIGNING_IDENTITY: ${{ vars.GLANCEBAR_SIGNING_IDENTITY }}
        run: ./Scripts/package-app.sh

      - name: Notarize app archive
        env:
          APPLE_NOTARY_KEY_BASE64: ${{ secrets.APPLE_NOTARY_KEY_BASE64 }}
        run: |
          notary_key_path="$RUNNER_TEMP/AuthKey_${APPLE_NOTARY_KEY_ID}.p8"
          printf '%s' "$APPLE_NOTARY_KEY_BASE64" | base64 --decode > "$notary_key_path"
          chmod 600 "$notary_key_path"
          APPLE_NOTARY_KEY_PATH="$notary_key_path" ./Scripts/notarize-app.sh

      - name: Generate signed update feed
        env:
          SPARKLE_EDDSA_PRIVATE_KEY: ${{ secrets.SPARKLE_EDDSA_PRIVATE_KEY }}
        run: |
          mkdir -p .build/appcast
          cp dist/GlanceBar.app.zip .build/appcast/GlanceBar.app.zip
          printf '%s' "$SPARKLE_EDDSA_PRIVATE_KEY" | \
            .build/artifacts/sparkle/Sparkle/bin/generate_appcast \
              --ed-key-file - \
              --download-url-prefix "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/" \
              --maximum-deltas 0 \
              --maximum-versions 1 \
              .build/appcast
          cp .build/appcast/appcast.xml dist/appcast.xml

      - name: Remove notarization key
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey_${APPLE_NOTARY_KEY_ID}.p8"

      - name: Upload release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/GlanceBar.dmg
            dist/GlanceBar.app.zip
            dist/appcast.xml
          draft: false
          prerelease: false
